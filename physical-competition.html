<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#000000">
  <meta name="description" content="CHAYAMANA 2026 Physical Competition by MCPAS – Mahanama College Photographic Art Society. Countdown to December 5, 2026.">
  <link rel="icon" type="image/png" href="Pics/IMG_8922.PNG">
  <title>Physical Competition Countdown | CHAYAMANA 2026 | MCPAS</title>
  <style>
    :root {
      --accent: #ff9800;
      --accent-soft: rgba(255, 152, 0, .35);
      --text: #fff;
      --muted: #9a9a9a;
      --line: rgba(255, 255, 255, .55);
      --mono: "Courier New", ui-monospace, monospace;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 28px 18px;
      display: grid;
      place-items: center;
      overflow-x: hidden;
      background: radial-gradient(ellipse at center, #1a1208 0%, #070707 55%, #000 100%);
      color: var(--text);
      font-family: Arial, sans-serif;
      text-align: center;
    }

    /* Rule-of-thirds grid */
    body::before {
      position: fixed;
      inset: 0;
      z-index: 0;
      background:
        linear-gradient(to right, transparent calc(33.33% - .5px), rgba(255,255,255,.06) 33.33%, transparent calc(33.33% + .5px)),
        linear-gradient(to right, transparent calc(66.66% - .5px), rgba(255,255,255,.06) 66.66%, transparent calc(66.66% + .5px)),
        linear-gradient(to bottom, transparent calc(33.33% - .5px), rgba(255,255,255,.06) 33.33%, transparent calc(33.33% + .5px)),
        linear-gradient(to bottom, transparent calc(66.66% - .5px), rgba(255,255,255,.06) 66.66%, transparent calc(66.66% + .5px));
      content: "";
      pointer-events: none;
    }

    /* Vignette */
    body::after {
      position: fixed;
      inset: 0;
      z-index: 0;
      background: radial-gradient(ellipse at center, transparent 50%, rgba(0,0,0,.75) 100%);
      content: "";
      pointer-events: none;
    }

    /* ---------- Viewfinder frame ---------- */
    .viewfinder {
      position: fixed;
      inset: 18px;
      z-index: 2;
      pointer-events: none;
      font-family: var(--mono);
      font-size: 12px;
      letter-spacing: .12em;
      color: var(--line);
    }

    .corner {
      position: absolute;
      width: 46px;
      height: 46px;
      border-color: var(--line);
      border-style: solid;
      border-width: 0;
    }
    .corner.tl { top: 0; left: 0; border-top-width: 2px; border-left-width: 2px; }
    .corner.tr { top: 0; right: 0; border-top-width: 2px; border-right-width: 2px; }
    .corner.bl { bottom: 0; left: 0; border-bottom-width: 2px; border-left-width: 2px; }
    .corner.br { bottom: 0; right: 0; border-bottom-width: 2px; border-right-width: 2px; }

    .hud {
      position: absolute;
      left: 62px;
      right: 62px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }
    .hud.top { top: 14px; }
    .hud.bottom { bottom: 14px; }

    .rec { display: inline-flex; align-items: center; gap: 8px; color: #fff; }
    .rec::before {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #ff3b30;
      box-shadow: 0 0 10px #ff3b30;
      content: "";
      animation: blink 1.2s steps(2, start) infinite;
    }

    .battery {
      position: relative;
      width: 28px;
      height: 13px;
      border: 1.5px solid var(--line);
      border-radius: 2px;
      padding: 1.5px;
    }
    .battery::before {
      display: block;
      width: 75%;
      height: 100%;
      background: var(--line);
      content: "";
    }
    .battery::after {
      position: absolute;
      top: 3px;
      right: -5px;
      width: 3px;
      height: 5px;
      background: var(--line);
      content: "";
    }

    .exposure span { margin: 0 10px; }
    .exposure b { color: var(--accent); font-weight: 400; }

    /* ---------- Main content ---------- */
    main {
      position: relative;
      z-index: 1;
      width: min(820px, 100%);
      padding: 70px 0 60px;
    }

    .aperture {
      position: absolute;
      top: 50%;
      left: 50%;
      z-index: -1;
      width: min(560px, 92vw);
      transform: translate(-50%, -54%);
      opacity: .09;
      animation: spin 60s linear infinite;
    }

    .eyebrow {
      margin: 0 0 18px;
      color: var(--accent);
      font-size: 13px;
      font-weight: 700;
      letter-spacing: .3em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(38px, 8vw, 76px);
      line-height: 1.05;
    }
    h1 span { color: #bbb; font-weight: 300; }

    .date {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      margin: 22px 0 34px;
      padding: 6px 14px;
      border: 1px solid rgba(255,255,255,.18);
      border-radius: 4px;
      color: #ccc;
      font-family: var(--mono);
      font-size: clamp(14px, 2.6vw, 17px);
      letter-spacing: .1em;
    }
    .date::before {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--accent);
      content: "";
    }

    /* Focus square around title */
    .focus {
      position: relative;
      display: inline-block;
      padding: 18px 28px;
    }
    .focus i {
      position: absolute;
      width: 18px;
      height: 18px;
      border: 0 solid var(--accent);
      animation: focus 3s ease-in-out infinite;
    }
    .focus i:nth-child(1) { top: 0; left: 0; border-top-width: 2px; border-left-width: 2px; }
    .focus i:nth-child(2) { top: 0; right: 0; border-top-width: 2px; border-right-width: 2px; }
    .focus i:nth-child(3) { bottom: 0; left: 0; border-bottom-width: 2px; border-left-width: 2px; }
    .focus i:nth-child(4) { bottom: 0; right: 0; border-bottom-width: 2px; border-right-width: 2px; }

    /* ---------- Film strip countdown ---------- */
    .filmstrip {
      position: relative;
      margin: 0 auto 36px;
      padding: 30px 18px;
      background: #111;
      border-radius: 6px;
      box-shadow: 0 20px 50px rgba(0,0,0,.6), inset 0 0 0 1px rgba(255,255,255,.06);
    }

    /* Sprocket holes */
    .filmstrip::before,
    .filmstrip::after {
      position: absolute;
      left: 12px;
      right: 12px;
      height: 10px;
      background: repeating-linear-gradient(to right, #000 0 14px, transparent 14px 26px);
      border-radius: 2px;
      content: "";
    }
    .filmstrip::before { top: 10px; }
    .filmstrip::after { bottom: 10px; }

    .edge-text {
      position: absolute;
      bottom: -1px;
      right: 22px;
      transform: translateY(100%);
      padding-top: 6px;
      color: var(--accent);
      opacity: .6;
      font-family: var(--mono);
      font-size: 10px;
      letter-spacing: .25em;
    }

    .countdown {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 12px;
    }

    .unit {
      position: relative;
      padding: 24px 8px 18px;
      border-radius: 3px;
      background: linear-gradient(160deg, #2a1d0b 0%, #120c05 100%);
      box-shadow: inset 0 0 0 1px rgba(255,152,0,.18), inset 0 0 30px rgba(0,0,0,.6);
    }

    .frame-no {
      position: absolute;
      top: 6px;
      left: 8px;
      color: var(--accent);
      opacity: .55;
      font-family: var(--mono);
      font-size: 10px;
      letter-spacing: .1em;
    }

    .number {
      color: var(--accent);
      font-size: clamp(32px, 7vw, 54px);
      font-weight: 700;
      line-height: 1;
      font-variant-numeric: tabular-nums;
      text-shadow: 0 0 18px var(--accent-soft);
    }

    .label {
      margin-top: 10px;
      color: var(--muted);
      font-size: 11px;
      letter-spacing: .18em;
      text-transform: uppercase;
    }

    .finished {
      display: none;
      margin: 0 0 36px;
      color: var(--accent);
      font-size: clamp(22px, 5vw, 34px);
      font-weight: 700;
    }

    /* ---------- Shutter-button link ---------- */
    .back {
      display: inline-flex;
      min-height: 52px;
      align-items: center;
      justify-content: center;
      gap: 12px;
      padding: 0 26px 0 10px;
      border-radius: 999px;
      background: var(--accent);
      color: #000;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: .12em;
      text-decoration: none;
      text-transform: uppercase;
      transition: background .2s, transform .1s;
    }
    .back::before {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      background: #000;
      box-shadow: inset 0 0 0 3px var(--accent), inset 0 0 0 6px #000, inset 0 0 0 9px rgba(255,255,255,.85);
      content: "";
    }
    .back:hover,
    .back:focus-visible { background: #ffb13b; }
    .back:active { transform: scale(.97); }

    /* ---------- Shutter opening on load ---------- */
    .shutter {
      position: fixed;
      left: 0;
      right: 0;
      z-index: 10;
      height: 50vh;
      background: #000;
      pointer-events: none;
      animation: open .9s cubic-bezier(.7,0,.3,1) .35s forwards;
    }
    .shutter.top { top: 0; border-bottom: 1px solid #222; }
    .shutter.bottom { bottom: 0; border-top: 1px solid #222; animation-name: open-down; }

    .flash {
      position: fixed;
      inset: 0;
      z-index: 9;
      background: #fff;
      opacity: 0;
      pointer-events: none;
      animation: flash .6s ease-out .45s;
    }

    @keyframes open { to { transform: translateY(-100%); } }
    @keyframes open-down { to { transform: translateY(100%); } }
    @keyframes flash { 0% { opacity: .55; } 100% { opacity: 0; } }
    @keyframes spin { to { transform: translate(-50%, -54%) rotate(360deg); } }
    @keyframes blink { to { visibility: hidden; } }
    @keyframes focus {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.25); opacity: .5; }
    }

    @media (max-width: 600px) {
      .viewfinder { inset: 10px; font-size: 10px; }
      .corner { width: 30px; height: 30px; }
      .hud { left: 40px; right: 40px; }
      .exposure span { margin: 0 4px; }
      .exposure .hide-sm { display: none; }
      .countdown { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
      .unit { padding: 22px 8px 16px; }
      .focus { padding: 14px 18px; }
    }

    @media (prefers-reduced-motion: reduce) {
      .aperture, .rec::before, .focus i { animation: none; }
      .shutter, .flash { display: none; }
    }
  </style>
</head>
<body>
  <!-- Shutter + flash intro -->
  <div class="shutter top" aria-hidden="true"></div>
  <div class="shutter bottom" aria-hidden="true"></div>
  <div class="flash" aria-hidden="true"></div>

  <!-- Camera viewfinder overlay -->
  <div class="viewfinder" aria-hidden="true">
    <span class="corner tl"></span><span class="corner tr"></span>
    <span class="corner bl"></span><span class="corner br"></span>
    <div class="hud top">
      <span class="rec">REC</span>
      <span>CHAYAMANA 2026</span>
      <span class="battery"></span>
    </div>
    <div class="hud bottom">
      <span class="exposure"><span><b>f/</b>2.8</span><span>1/250s</span><span class="hide-sm">ISO 400</span></span>
      <span>[ AF ]</span>
    </div>
  </div>

  <main>
    <!-- Aperture blades -->
    <svg class="aperture" viewBox="-110 -110 220 220" aria-hidden="true">
      <circle r="100" fill="none" stroke="#fff" stroke-width="3"/>
      <circle r="106" fill="none" stroke="#fff" stroke-width="1" stroke-dasharray="2 6"/>
      <g stroke="#fff" stroke-width="2.5" fill="none">
        <line x1="-67.4" y1="-73.9" x2="30.3" y2="-17.5"/>
        <line x1="-67.4" y1="-73.9" x2="30.3" y2="-17.5" transform="rotate(60)"/>
        <line x1="-67.4" y1="-73.9" x2="30.3" y2="-17.5" transform="rotate(120)"/>
        <line x1="-67.4" y1="-73.9" x2="30.3" y2="-17.5" transform="rotate(180)"/>
        <line x1="-67.4" y1="-73.9" x2="30.3" y2="-17.5" transform="rotate(240)"/>
        <line x1="-67.4" y1="-73.9" x2="30.3" y2="-17.5" transform="rotate(300)"/>
      </g>
    </svg>

    <p class="eyebrow">CHAYAMANA | MCPAS</p>

    <div class="focus">
      <i></i><i></i><i></i><i></i>
      <h1>Physical <span>Competition</span></h1>
    </div>

    <br>
    <p class="date">DEC 05 · 2026</p>

    <div class="filmstrip">
      <div class="countdown" id="countdown" aria-label="Time remaining until the physical competition">
        <div class="unit"><span class="frame-no">01</span><div class="number" id="days">00</div><div class="label">Days</div></div>
        <div class="unit"><span class="frame-no">02</span><div class="number" id="hours">00</div><div class="label">Hours</div></div>
        <div class="unit"><span class="frame-no">03</span><div class="number" id="minutes">00</div><div class="label">Minutes</div></div>
        <div class="unit"><span class="frame-no">04</span><div class="number" id="seconds">00</div><div class="label">Seconds</div></div>
      </div>
      <p class="finished" id="finished" role="status">Lights. Camera. Capture! The competition day is here.</p>
      <span class="edge-text">MCPAS 400 ▸ 24</span>
    </div>

    <a class="back" href="index.html">Back to homepage</a>
  </main>

  <script>
    var competitionDate = new Date(2026, 11, 5, 0, 0, 0).getTime();
    var countdown = document.getElementById('countdown');
    var finished = document.getElementById('finished');
    var timer;

    function pad(n) { return String(n).padStart(2, '0'); }

    function updateCountdown() {
      var remaining = competitionDate - Date.now();

      if (remaining <= 0) {
        countdown.style.display = 'none';
        finished.style.display = 'block';
        clearInterval(timer);
        return;
      }

      document.getElementById('days').textContent = pad(Math.floor(remaining / 86400000));
      document.getElementById('hours').textContent = pad(Math.floor((remaining % 86400000) / 3600000));
      document.getElementById('minutes').textContent = pad(Math.floor((remaining % 3600000) / 60000));
      document.getElementById('seconds').textContent = pad(Math.floor((remaining % 60000) / 1000));
    }

    updateCountdown();
    if (competitionDate > Date.now()) {
      timer = setInterval(updateCountdown, 1000);
    }
  </script>
</body>
</html>
